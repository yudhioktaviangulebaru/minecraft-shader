# Segaraders - OptiFine / Oculus shader pack properties
# Minecraft Java 1.20.1, GLSL 330 compatibility

# ---- Menu ----
screen=<profile> <empty> [WATER] [ATMOSPHERE]
screen.WATER=WATER_WAVES WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_OCTAVES \
    WATER_NORMAL_STRENGTH <empty> \
    WATER_REFLECTIONS WATER_SUN_SPECULAR SSR_STEPS SSR_REFINE_STEPS \
    WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_CLARITY WATER_BIOME_TINT \
    WATER_CAUSTICS WATER_CAUSTICS_STRENGTH WATER_FOAM
screen.ATMOSPHERE=BORDER_FOG FOG_START

sliders=FOG_START WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_OCTAVES WATER_NORMAL_STRENGTH \
    WATER_SUN_SPECULAR SSR_STEPS SSR_REFINE_STEPS WATER_REFRACTION_STRENGTH WATER_CLARITY \
    WATER_CAUSTICS_STRENGTH

# ---- Profiles (MEDIUM = defaults in lib/settings.glsl) ----
profile.LOW=BORDER_FOG WATER_WAVES WATER_WAVE_OCTAVES:3 WATER_REFLECTIONS:1 SSR_STEPS:8 SSR_REFINE_STEPS:0 \
    !WATER_REFRACTION !WATER_CAUSTICS !WATER_FOAM
profile.MEDIUM=BORDER_FOG WATER_WAVES WATER_WAVE_OCTAVES:5 WATER_REFLECTIONS:2 SSR_STEPS:12 SSR_REFINE_STEPS:3 \
    WATER_REFRACTION WATER_CAUSTICS WATER_FOAM
profile.HIGH=BORDER_FOG WATER_WAVES WATER_WAVE_OCTAVES:6 WATER_REFLECTIONS:2 SSR_STEPS:24 SSR_REFINE_STEPS:4 \
    WATER_REFRACTION WATER_CAUSTICS WATER_FOAM
profile.ULTRA=BORDER_FOG WATER_WAVES WATER_WAVE_OCTAVES:8 WATER_REFLECTIONS:2 SSR_STEPS:48 SSR_REFINE_STEPS:6 \
    WATER_REFRACTION WATER_CAUSTICS WATER_FOAM

# ---- Blending ----
# Water writes alpha 0 to colortex0 (scene left intact for refraction) and alpha 1
# to colortex1/2 (surface data); glass does the opposite. Standard "over" blending
# on all buffers makes both work.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# ---- Render settings ----
oldLighting=false
underwaterOverlay=false
sun=true
moon=true
vignette=false
